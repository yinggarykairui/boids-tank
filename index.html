<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boids tank</title>
<meta name="description" content="A tank of flocking darts, each on a short ink trail, with sliders for cohesion, alignment and separation.">
<link rel="icon" href="data:,">
<style>
  :root {
    --paper: #f7f6f2;
    --field: #fafaf4;   /* also the canvas fade fixed point — see FADE */
    --ink: #17181a;
    --muted: #6b6961;
    /* The unfilled part of a slider track. The old #ddd9d0 hairline vanished
     * on a 2px track, and a slider at 0% became a lone dot with no visible
     * extent. 3.20:1 against the paper. */
    --track: #8c8a82;
    /* A line you are meant to see, but not to read as content: the tank's
     * own edge and the gutter hairlines between controls. Both were #ddd9d0
     * — 1.30:1 against the paper, under every threshold there is. The footer
     * said "edges wrap" about a border nobody could find, and the separators
     * came out fainter than the 3.20:1 track they separate. 2.69:1 is a line
     * you can see while staying quieter than the track, which is correct
     * weighting rather than a compromise: the gutter rule is 32px tall and
     * the track is 2px, so equal contrast would not be equal presence. */
    --edge: #9c978b;
    --accent: #b4432c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* A definite height, not a minimum: the column can then shrink as well as
   * grow, so a shorter viewport gives the tank back instead of scrolling.
   *
   * Every piece of chrome is sized continuously off the viewport height
   * rather than switched by a height media query. A query is a step, and a
   * step means the tank jumps as you drag the window edge; clamp() spends
   * the same pixels smoothly, so a 1px taller window is at most a 1px
   * different tank. */
  .wrap {
    --pad-t: clamp(8px, 1.6vh, 20px);
    --pad-b: clamp(8px, 1.8vh, 20px);
    --gap: clamp(6px, 1.2vh, 14px);
    --rowgap: clamp(2px, 0.55vh, 8px);
    --colgap: 28px;
    /* 44px of touch target where there is room, never under 40px on a
     * phone-sized screen, and never under 32px anywhere — which is what a
     * 320px-tall viewport can afford and still show a tank. */
    --rangeH: clamp(32px, 7.05vh, 44px);
    max-width: 1000px;
    height: 100vh;
    margin: 0 auto;
    padding: var(--pad-t) 16px var(--pad-b);
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  @supports (height: 100dvh) {
    .wrap { height: 100dvh; }
  }

  /* Title and tagline share a baseline and sit together. Flush-right, on a
   * 1440px screen, the tagline was 850px away from the thing it describes. */
  header {
    display: flex;
    align-items: baseline;
    justify-content: flex-start;
    gap: 2px 12px;
    flex-wrap: wrap;
  }

  /* The one deliberate step in the type scale: 20 / 15 / 13 / 12. Everything
   * else on the page was within a pixel of everything else. */
  h1 {
    font-size: 20px;
    line-height: 1.2;
    font-weight: 500;
    letter-spacing: 0.01em;
    margin: 0;
  }

  header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* flex-basis 0 so the tank is pure slack: it takes what is left after the
   * controls, and gives it straight back when the viewport shortens. */
  #tank {
    flex: 1 1 0;
    /* A low floor on purpose: on a 320x320 viewport the controls have to win,
     * and a short tank still flocks. Below roughly 320x256 this floor is what
     * finally produces a scrollbar. */
    min-height: 40px;
    border: 1px solid var(--edge);
    background: var(--field);
    position: relative;
    overflow: hidden;
  }

  /* Out of flow, so the canvas's own pixel height can never hold the tank
   * open at its previous size. */
  canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: var(--rowgap) var(--colgap);
  }

  .control {
    flex: 1 1 190px;
    min-width: 150px;
    position: relative;
  }

  /* A hairline in the gutter, so two thumbs at neighbouring extremes do not
   * read as one two-handled slider. Absolute, so track widths stay equal. */
  .control + .control::before {
    content: "";
    position: absolute;
    left: -14px;
    top: 2px;
    bottom: 10px;
    border-left: 1px solid var(--edge);
  }

  /* Label and value sit together: the pair must be closer to each other than
   * to the next control, or the strip reads as "cohesion … 50% alignment". */
  .control .row {
    display: flex;
    align-items: baseline;
    justify-content: flex-start;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .control .val {
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  /* Range input: a touch target tall, but only a hairline is painted.
   * --p (0..1) is written by the same function that writes the readout, and
   * drives how much of the track is accent. */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: var(--rangeH);
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    --p: 0.5;
    --fill: calc(8px + (100% - 16px) * var(--p));
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: linear-gradient(to right,
      var(--accent) 0 var(--fill), var(--track) var(--fill) 100%);
    border-radius: 2px;
  }

  input[type="range"]::-moz-range-track {
    height: 2px;
    background: linear-gradient(to right,
      var(--accent) 0 var(--fill), var(--track) var(--fill) 100%);
    border-radius: 2px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--ink);
    border: none;
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink);
    border: none;
  }

  button {
    flex: 0 0 auto;
    min-height: var(--rangeH);
    min-width: 112px;
    padding: 0 20px;
    font: inherit;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 2px;
    cursor: pointer;
  }

  button:hover { background: var(--ink); color: var(--paper); }
  button:active { background: var(--ink); color: var(--paper); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* The range box is 44px tall for touch but only a hairline is painted, so
   * an outset ring lands on the label above it. Keep the ring inside. */
  input[type="range"]:focus-visible { outline-offset: -1px; }

  footer {
    font-size: 12px;
    line-height: 1.4;
    color: var(--muted);
  }

  /* Padded to clear the 24x24 minimum target without moving the line. No
   * left padding to give back: at -10px the focus ring's left edge landed
   * 13px into the word before the link and struck it through. */
  footer a {
    display: inline-block;
    padding: 6px 8px;
    margin: -6px -8px -6px 0;
    color: var(--muted);
    text-decoration-color: var(--muted);
    text-underline-offset: 2px;
  }

  footer a:hover { color: var(--ink); }

  /* The padding is already the target; the ring goes round the word. */
  footer a:focus-visible { outline-offset: 1px; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* Narrow: the sliders stack, so a control that costs a text row plus a
   * touch target costs the tank 60px it cannot spare. The label rides in the
   * range box's own empty upper half instead — the hairline track is painted
   * down the middle of that box, so the space above it was already there. */
  @media (max-width: 520px) {
    .wrap { --colgap: 18px; }
    .control { flex: 1 1 100%; }
    .control + .control::before { content: none; }
    .control .row {
      position: absolute;
      left: 0;
      right: 0;
      /* Anchored to the track rather than to the top of the box, so a label
       * enlarged by a browser minimum font size grows up into the gap
       * instead of down through the track. */
      bottom: 50%;
      margin-bottom: 3px;
      line-height: 1.2;
      /* The gaps in the row are see-through, so the box under them stays
       * draggable — but the words themselves take their own taps. Falling
       * through, a tap on "separation" reached the range at the x of the
       * word, which is the left end of the track: the value jumped to near
       * zero and there is no undo. Now the text absorbs it and the label
       * hands focus to the slider, which is what a label is for. */
      pointer-events: none;
    }
    /* Not selectable: taking the pointer back also made the words draggable
     * as text, and a caption smeared blue — or a long-press selection handle
     * standing over the track — is not what a slider should do. */
    .control .row > * {
      pointer-events: auto;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }
    button { width: 100%; }
  }

  /* Between the stacked layout and the width where all four fit on one line,
   * the button wraps to a line of its own. Left-aligned it sat under the
   * cohesion slider with half a screen of void beside it and read as a bug;
   * right-aligned it lands under the separation slider's right edge, which
   * is where it lives on a wide screen. */
  @media (min-width: 521px) and (max-width: 797px) {
    #scatter { margin-left: auto; margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>boids tank</h1>
    <p>three rules, one flock</p>
  </header>

  <div id="tank">
    <canvas id="field" role="img" aria-label="A flock of small dark darts drifting across a pale field, each drawing a short ink trail behind it."></canvas>
  </div>

  <div class="controls">
    <div class="control">
      <div class="row"><label for="cohesion">cohesion</label><span class="val" id="cohesion-val">50%</span></div>
      <input type="range" id="cohesion" min="0" max="100" step="1" value="50">
    </div>
    <div class="control">
      <div class="row"><label for="alignment">alignment</label><span class="val" id="alignment-val">62%</span></div>
      <input type="range" id="alignment" min="0" max="100" step="1" value="62">
    </div>
    <div class="control">
      <div class="row"><label for="separation">separation</label><span class="val" id="separation-val">55%</span></div>
      <input type="range" id="separation" min="0" max="100" step="1" value="55">
    </div>
    <button type="button" id="scatter">scatter</button>
  </div>

  <footer>drag a rule to feel it. edges wrap. <a href="tests.html">tests</a></footer>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</div>

<script src="boids.js"></script>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var tank = document.getElementById('tank');
  var ctx = canvas.getContext('2d');

  /* The flock is sized by the tank, not by the desktop this was written on.
   * A fixed 140 puts 3.3x the ink on a phone that it puts on a desktop, and
   * the flock stops reading as triangles at all. 140 in a full-size tank,
   * down to a floor of 60 in the smallest one. */
  function countFor(w, h) {
    return Boids.clamp(Math.round((w * h) / 4400), 60, 140);
  }

  /* Reduced motion: a full-viewport field of 140 things moving forever at
   * half speed is still the thing a vestibular-sensitive visitor asked not
   * to have. So the page loads stopped, on a composed still, and starts the
   * first time the visitor moves a slider or presses scatter — after which
   * it runs at half speed, as before. Nobody is asked to find a new
   * control; the two controls the page already has are the switch. */
  var calmQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var timeScale = calmQuery.matches ? 0.5 : 1;
  var running = !calmQuery.matches;

  var cssW = Math.max(1, Math.round(tank.clientWidth));
  var cssH = Math.max(1, Math.round(tank.clientHeight));
  var backingScale = 0;

  /* Fixed seed: the load frame is a composition, not a coin toss. Measured on
   * this build, 131 lands one coherent flock whose ink centroid sits at
   * (0.47, 0.43) of a desktop frame, (0.50, 0.49) at 360px and (0.48, 0.53)
   * at 414px — near the middle, a little above and left of it, which leaves
   * scatter somewhere to scatter to. The right-hand quarter of a desktop
   * frame is empty at load: of 1500 seeds searched, every seed that fills all
   * four quarters does it by splitting the flock into two or three groups,
   * which is a worse frame than an off-centre one. */
  var world = new Boids.World(cssW, cssH, countFor(cssW, cssH), 131);
  /* Load into a formed flock, not a cloud of confetti: seed two coherent
   * groups, then run five seconds of simulation before the first paint. */
  world.seedClusters(2);
  world.warmUp(5);

  /* ---------- canvas sizing ---------- */

  function dpr() {
    return Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  }

  function resizeCanvas() {
    var w = Math.max(1, Math.round(tank.clientWidth));
    var h = Math.max(1, Math.round(tank.clientHeight));
    var scale = dpr();
    /* Invalidate on backing scale as well as CSS size. */
    if (w === cssW && h === cssH && scale === backingScale) return;
    cssW = w;
    cssH = h;
    backingScale = scale;
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    /* A resized canvas comes back transparent; start it on solid field so
     * the trails have something to fade into. In device pixels, because the
     * backing store is rounded up: at scale 1.25 a 966px tank is 1208 device
     * columns, and a CSS-space fill reaches 1207.5 of them. */
    paintField(SOLID);
    scaleTri = triScale(w, h);
    world.resize(w, h);
    world.setCount(countFor(w, h));
    if (running) draw();
    else composeStill();
  }

  var dprMedia = null;
  function watchDpr() {
    if (dprMedia) {
      if (dprMedia.removeEventListener) dprMedia.removeEventListener('change', onDprChange);
      else if (dprMedia.removeListener) dprMedia.removeListener(onDprChange);
    }
    dprMedia = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
    if (dprMedia.addEventListener) dprMedia.addEventListener('change', onDprChange);
    else if (dprMedia.addListener) dprMedia.addListener(onDprChange);
  }
  function onDprChange() {
    watchDpr();
    resizeCanvas();
  }
  watchDpr();

  if (window.ResizeObserver) {
    new ResizeObserver(resizeCanvas).observe(tank);
  }
  window.addEventListener('resize', resizeCanvas);

  /* ---------- drawing ---------- */

  var LEN = 6.2, BACK = 4.2, HALF = 2.9;
  var scaleTri = 1;
  var offX = [0, 0], offY = [0, 0];

  /* Slightly smaller triangles in a small tank, so a phone does not read
   * as a page of chevrons. */
  function triScale(w, h) {
    return Boids.clamp(Math.sqrt(w * h) / 860, 0.74, 1.12);
  }

  /* Instead of clearing, lay down the field colour at low alpha: the boids
   * leave short ink trails, so the flock reads as currents rather than as a
   * field of loose chevrons, and scatter gains a visible shockwave. */
  /* The fade colour is not --field, and that is deliberate. A translucent
   * fill is quantised twice over on an 8-bit canvas, so fading toward
   * rgb(251,250,247) actually stalls at rgb(248,240,240) and leaves a haze
   * over everything the flock has ever crossed, for good. rgb(253,253,248)
   * at 0.16 has rgb(250,250,244) as its exact fixed point, which is the
   * field colour, so trails fade all the way out and stop there. */
  var SOLID = 'rgb(250, 250, 244)';
  var FADE = 'rgba(253, 253, 248, 0.16)';

  /* Cover the whole backing store, transform reset, in device pixels. Under
   * the scale transform the fill stops at cssW*scale, and Math.round() has
   * already made the canvas a device pixel wider or taller than that at
   * fractional device pixel ratios (Windows at 125/150/175% display
   * scaling) — leaving the last row or column bare white. */
  function paintField(style) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = style;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  function draw() {
    var w = cssW, h = cssH;
    paintField(FADE);
    ctx.fillStyle = '#17181a';
    ctx.beginPath();

    var len = LEN * scaleTri, back = BACK * scaleTri, half = HALF * scaleTri;
    var boids = world.boids;
    var margin = len + 2;
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      var ux = 1, uy = 0;
      if (sp > 1e-6) { ux = b.vx / sp; uy = b.vy / sp; }

      /* Draw wrapped copies near the seams so nothing pops in or out. */
      var nx = 1, ny = 1;
      offX[0] = 0; offY[0] = 0;
      if (b.x < margin) { offX[1] = w; nx = 2; }
      else if (b.x > w - margin) { offX[1] = -w; nx = 2; }
      if (b.y < margin) { offY[1] = h; ny = 2; }
      else if (b.y > h - margin) { offY[1] = -h; ny = 2; }

      for (var a = 0; a < nx; a++) {
        for (var c = 0; c < ny; c++) {
          var x = b.x + offX[a], y = b.y + offY[c];
          ctx.moveTo(x + ux * len, y + uy * len);
          ctx.lineTo(x - ux * back - uy * half, y - uy * back + ux * half);
          ctx.lineTo(x - ux * back + uy * half, y - uy * back - ux * half);
          ctx.closePath();
        }
      }
    }
    ctx.fill();
  }

  /* ---------- loop (fixed step, bounded catch-up) ---------- */

  var STEP = 1 / 60;
  var acc = 0;
  var last = 0;

  function frame(now) {
    if (!running) return;                    /* stopped: no frame is asked for */
    if (!last) last = now;
    var elapsed = (now - last) / 1000;
    last = now;
    if (!isFinite(elapsed) || elapsed < 0) elapsed = 0;
    if (elapsed > 0.25) elapsed = 0.25;      /* after a background tab pause */
    acc += elapsed * timeScale;
    var guard = 0;
    while (acc >= STEP && guard < 4) { world.step(STEP); acc -= STEP; guard++; }
    if (acc > STEP * 4) acc = 0;
    draw();
    requestAnimationFrame(frame);
  }

  /* The still a stopped page is left on. A boid's shape on this canvas is
   * partly its own ink trail, so a single draw of a stopped flock is a
   * frame of bare darts. Step a third of a second and paint every step of
   * it, all inside one turn of the event loop: the browser paints once, at
   * the end, and what it paints is the flock with its tails. */
  function composeStill() {
    for (var i = 0; i < 20; i++) { world.step(STEP); draw(); }
  }

  /* First deliberate interaction starts the motion. Returns true if this is
   * the one that did it, so the caller can say so. */
  function wake() {
    if (running) return false;
    running = true;
    last = 0;
    acc = 0;
    requestAnimationFrame(frame);
    return true;
  }

  /* ---------- controls ---------- */

  function bind(id, key) {
    var input = document.getElementById(id);
    var out = document.getElementById(id + '-val');
    function apply() {
      var v = Number(input.value);
      if (!isFinite(v)) v = 0;
      var p = {};
      p[key] = v / 100;
      world.setParams(p);
      out.textContent = Math.round(v) + '%';
      /* Fill the track up to the thumb, so the accent encodes the value. */
      input.style.setProperty('--p', String(Boids.clamp(v / 100, 0, 1)));
    }
    input.addEventListener('input', function () {
      apply();
      if (wake()) say('Flock moving.');
    });
    /* The readout is a span, and pointer-events alone does not save it: on a
     * narrow screen it lies over the range box, and a span with nothing
     * listening is not a tap target, so Chromium's touch adjustment hands
     * the tap to the range underneath and the value jumps to the readout's
     * x. Listening is what makes it a target. Focus goes to the slider, so
     * tapping either half of the caption does the same thing as tapping the
     * label. */
    out.addEventListener('click', function () { input.focus(); });
    apply();
  }

  bind('cohesion', 'cohesion');
  bind('alignment', 'alignment');
  bind('separation', 'separation');

  /* One polite announcement per scatter, and nothing on a slider tick —
   * the range inputs already speak their own values. */
  var status = document.getElementById('status');
  var sayTimer = 0;
  function say(msg) {
    if (!status) return;
    status.textContent = '';
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function () { status.textContent = msg; }, 60);
  }

  document.getElementById('scatter').addEventListener('click', function () {
    var woke = wake();
    world.scatter();
    say((woke ? 'Flock moving. ' : '') + 'Flock scattered. It re-forms in a few seconds.');
  });

  if (calmQuery.addEventListener) {
    calmQuery.addEventListener('change', function (e) {
      timeScale = e.matches ? 0.5 : 1;
      /* Preference lifted mid-visit: never leave the page frozen for
       * someone who is no longer asking for that. */
      if (!e.matches) wake();
    });
  }

  /* ---------- go ---------- */

  resizeCanvas();
  if (running) {
    requestAnimationFrame(frame);
  } else {
    say('The flock is still, because your system asks for reduced motion. ' +
        'Move a slider or press scatter to start it.');
  }

  /* Exposed for the headless checks; harmless otherwise. */
  window.__tank = world;
})();
</script>
</body>
</html>
