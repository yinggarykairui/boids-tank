<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boids tank</title>
<meta name="description" content="A tank of flocking triangles with sliders for cohesion, alignment and separation.">
<link rel="icon" href="data:,">
<style>
  :root {
    --paper: #f7f6f2;
    --field: #fafaf4;   /* also the canvas fade fixed point — see FADE */
    --ink: #17181a;
    --muted: #6b6961;
    --rule: #ddd9d0;
    --accent: #b4432c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* A definite height, not a minimum: the column can then shrink as well as
   * grow, so a shorter viewport gives the tank back instead of scrolling. */
  .wrap {
    max-width: 1000px;
    height: 100vh;
    margin: 0 auto;
    padding: 20px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  @supports (height: 100dvh) {
    .wrap { height: 100dvh; }
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    margin: 0;
  }

  header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* flex-basis 0 so the tank is pure slack: it takes what is left after the
   * controls, and gives it straight back when the viewport shortens. */
  #tank {
    flex: 1 1 0;
    min-height: 100px;
    border: 1px solid var(--rule);
    background: var(--field);
    position: relative;
    overflow: hidden;
  }

  /* Out of flow, so the canvas's own pixel height can never hold the tank
   * open at its previous size. */
  canvas {
    display: block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 10px 28px;
  }

  .control {
    flex: 1 1 190px;
    min-width: 150px;
    position: relative;
  }

  /* A hairline in the gutter, so two thumbs at neighbouring extremes do not
   * read as one two-handled slider. Absolute, so track widths stay equal. */
  .control + .control::before {
    content: "";
    position: absolute;
    left: -14px;
    top: 2px;
    bottom: 10px;
    border-left: 1px solid var(--rule);
  }

  /* Label and value sit together: the pair must be closer to each other than
   * to the next control, or the strip reads as "cohesion … 50% alignment". */
  .control .row {
    display: flex;
    align-items: baseline;
    justify-content: flex-start;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .control .val {
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  /* Range input: 44px tall for touch, but only a hairline is painted.
   * --p (0..1) is written by the same function that writes the readout, and
   * drives how much of the track is accent. */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 44px;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    --p: 0.5;
    --fill: calc(8px + (100% - 16px) * var(--p));
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background: linear-gradient(to right,
      var(--accent) 0 var(--fill), var(--rule) var(--fill) 100%);
    border-radius: 2px;
  }

  input[type="range"]::-moz-range-track {
    height: 2px;
    background: linear-gradient(to right,
      var(--accent) 0 var(--fill), var(--rule) var(--fill) 100%);
    border-radius: 2px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--ink);
    border: none;
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink);
    border: none;
  }

  button {
    flex: 0 0 auto;
    min-height: 44px;
    min-width: 112px;
    padding: 0 20px;
    font: inherit;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 2px;
    cursor: pointer;
  }

  button:hover { background: var(--ink); color: var(--paper); }
  button:active { background: var(--ink); color: var(--paper); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* The range box is 44px tall for touch but only a hairline is painted, so
   * an outset ring lands on the label above it. Keep the ring inside. */
  input[type="range"]:focus-visible { outline-offset: -1px; }

  footer {
    font-size: 12px;
    color: var(--muted);
  }

  /* Padded to clear the 24x24 minimum target without moving the line. */
  footer a {
    display: inline-block;
    padding: 6px 10px;
    margin: -6px -10px;
    color: var(--muted);
    text-decoration-color: var(--muted);
    text-underline-offset: 2px;
  }

  footer a:hover { color: var(--ink); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* Short viewports (landscape phones, 200% zoom): trim the chrome so all
   * four controls still land above the fold. */
  @media (max-height: 620px) {
    .wrap { padding: 12px 16px 14px; gap: 10px; }
    .controls { gap: 6px 28px; }
    input[type="range"] { height: 34px; }
    button { min-height: 38px; }
  }

  @media (max-width: 520px) {
    .controls { gap: 4px 18px; }
    .control { flex: 1 1 100%; }
    .control + .control::before { content: none; }
    button { width: 100%; margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>boids tank</h1>
    <p>three rules, one flock</p>
  </header>

  <div id="tank">
    <canvas id="field" role="img" aria-label="A flock of small triangles drifting across a pale field."></canvas>
  </div>

  <div class="controls">
    <div class="control">
      <div class="row"><label for="cohesion">cohesion</label><span class="val" id="cohesion-val">50%</span></div>
      <input type="range" id="cohesion" min="0" max="100" step="1" value="50">
    </div>
    <div class="control">
      <div class="row"><label for="alignment">alignment</label><span class="val" id="alignment-val">62%</span></div>
      <input type="range" id="alignment" min="0" max="100" step="1" value="62">
    </div>
    <div class="control">
      <div class="row"><label for="separation">separation</label><span class="val" id="separation-val">55%</span></div>
      <input type="range" id="separation" min="0" max="100" step="1" value="55">
    </div>
    <button type="button" id="scatter">scatter</button>
  </div>

  <footer>drag a rule to feel it. edges wrap. <a href="tests.html">tests</a></footer>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</div>

<script src="boids.js"></script>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var tank = document.getElementById('tank');
  var ctx = canvas.getContext('2d');

  /* The flock is sized by the tank, not by the desktop this was written on.
   * A fixed 140 puts 3.3x the ink on a phone that it puts on a desktop, and
   * the flock stops reading as triangles at all. 140 in a full-size tank,
   * down to a floor of 60 in the smallest one. */
  function countFor(w, h) {
    return Boids.clamp(Math.round((w * h) / 4400), 60, 140);
  }

  var calmQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var timeScale = calmQuery.matches ? 0.5 : 1;

  var cssW = Math.max(1, Math.round(tank.clientWidth));
  var cssH = Math.max(1, Math.round(tank.clientHeight));
  var backingScale = 0;

  /* Fixed seed: the load frame is a composition, not a coin toss. 131 lands
   * one coherent flock near the middle of the field across tank sizes, which
   * also leaves scatter somewhere to scatter to. */
  var world = new Boids.World(cssW, cssH, countFor(cssW, cssH), 131);
  /* Load into a formed flock, not a cloud of confetti: seed two coherent
   * groups, then run five seconds of simulation before the first paint. */
  world.seedClusters(2);
  world.warmUp(5);

  /* ---------- canvas sizing ---------- */

  function dpr() {
    return Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  }

  function resizeCanvas() {
    var w = Math.max(1, Math.round(tank.clientWidth));
    var h = Math.max(1, Math.round(tank.clientHeight));
    var scale = dpr();
    /* Invalidate on backing scale as well as CSS size. */
    if (w === cssW && h === cssH && scale === backingScale) return;
    cssW = w;
    cssH = h;
    backingScale = scale;
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    /* A resized canvas comes back transparent; start it on solid field so
     * the trails have something to fade into. */
    ctx.fillStyle = SOLID;
    ctx.fillRect(0, 0, w, h);
    scaleTri = triScale(w, h);
    world.resize(w, h);
    world.setCount(countFor(w, h));
    draw();
  }

  var dprMedia = null;
  function watchDpr() {
    if (dprMedia) {
      if (dprMedia.removeEventListener) dprMedia.removeEventListener('change', onDprChange);
      else if (dprMedia.removeListener) dprMedia.removeListener(onDprChange);
    }
    dprMedia = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
    if (dprMedia.addEventListener) dprMedia.addEventListener('change', onDprChange);
    else if (dprMedia.addListener) dprMedia.addListener(onDprChange);
  }
  function onDprChange() {
    watchDpr();
    resizeCanvas();
  }
  watchDpr();

  if (window.ResizeObserver) {
    new ResizeObserver(resizeCanvas).observe(tank);
  }
  window.addEventListener('resize', resizeCanvas);

  /* ---------- drawing ---------- */

  var LEN = 6.2, BACK = 4.2, HALF = 2.9;
  var scaleTri = 1;
  var offX = [0, 0], offY = [0, 0];

  /* Slightly smaller triangles in a small tank, so a phone does not read
   * as a page of chevrons. */
  function triScale(w, h) {
    return Boids.clamp(Math.sqrt(w * h) / 860, 0.74, 1.12);
  }

  /* Instead of clearing, lay down the field colour at low alpha: the boids
   * leave short ink trails, so the flock reads as currents rather than as a
   * field of loose chevrons, and scatter gains a visible shockwave. */
  /* The fade colour is not --field, and that is deliberate. A translucent
   * fill is quantised twice over on an 8-bit canvas, so fading toward
   * rgb(251,250,247) actually stalls at rgb(248,240,240) and leaves a haze
   * over everything the flock has ever crossed, for good. rgb(253,253,248)
   * at 0.16 has rgb(250,250,244) as its exact fixed point, which is the
   * field colour, so trails fade all the way out and stop there. */
  var SOLID = 'rgb(250, 250, 244)';
  var FADE = 'rgba(253, 253, 248, 0.16)';

  function draw() {
    var w = cssW, h = cssH;
    ctx.fillStyle = FADE;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#17181a';
    ctx.beginPath();

    var len = LEN * scaleTri, back = BACK * scaleTri, half = HALF * scaleTri;
    var boids = world.boids;
    var margin = len + 2;
    for (var i = 0; i < boids.length; i++) {
      var b = boids[i];
      var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      var ux = 1, uy = 0;
      if (sp > 1e-6) { ux = b.vx / sp; uy = b.vy / sp; }

      /* Draw wrapped copies near the seams so nothing pops in or out. */
      var nx = 1, ny = 1;
      offX[0] = 0; offY[0] = 0;
      if (b.x < margin) { offX[1] = w; nx = 2; }
      else if (b.x > w - margin) { offX[1] = -w; nx = 2; }
      if (b.y < margin) { offY[1] = h; ny = 2; }
      else if (b.y > h - margin) { offY[1] = -h; ny = 2; }

      for (var a = 0; a < nx; a++) {
        for (var c = 0; c < ny; c++) {
          var x = b.x + offX[a], y = b.y + offY[c];
          ctx.moveTo(x + ux * len, y + uy * len);
          ctx.lineTo(x - ux * back - uy * half, y - uy * back + ux * half);
          ctx.lineTo(x - ux * back + uy * half, y - uy * back - ux * half);
          ctx.closePath();
        }
      }
    }
    ctx.fill();
  }

  /* ---------- loop (fixed step, bounded catch-up) ---------- */

  var STEP = 1 / 60;
  var acc = 0;
  var last = 0;

  function frame(now) {
    if (!last) last = now;
    var elapsed = (now - last) / 1000;
    last = now;
    if (!isFinite(elapsed) || elapsed < 0) elapsed = 0;
    if (elapsed > 0.25) elapsed = 0.25;      /* after a background tab pause */
    acc += elapsed * timeScale;
    var guard = 0;
    while (acc >= STEP && guard < 4) { world.step(STEP); acc -= STEP; guard++; }
    if (acc > STEP * 4) acc = 0;
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- controls ---------- */

  function bind(id, key) {
    var input = document.getElementById(id);
    var out = document.getElementById(id + '-val');
    function apply() {
      var v = Number(input.value);
      if (!isFinite(v)) v = 0;
      var p = {};
      p[key] = v / 100;
      world.setParams(p);
      out.textContent = Math.round(v) + '%';
      /* Fill the track up to the thumb, so the accent encodes the value. */
      input.style.setProperty('--p', String(Boids.clamp(v / 100, 0, 1)));
    }
    input.addEventListener('input', apply);
    apply();
  }

  bind('cohesion', 'cohesion');
  bind('alignment', 'alignment');
  bind('separation', 'separation');

  /* One polite announcement per scatter, and nothing on a slider tick —
   * the range inputs already speak their own values. */
  var status = document.getElementById('status');
  var sayTimer = 0;
  function say(msg) {
    if (!status) return;
    status.textContent = '';
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function () { status.textContent = msg; }, 60);
  }

  document.getElementById('scatter').addEventListener('click', function () {
    world.scatter();
    say('Flock scattered. It re-forms in a few seconds.');
  });

  if (calmQuery.addEventListener) {
    calmQuery.addEventListener('change', function (e) { timeScale = e.matches ? 0.5 : 1; });
  }

  /* ---------- go ---------- */

  resizeCanvas();
  requestAnimationFrame(frame);

  /* Exposed for the headless checks; harmless otherwise. */
  window.__tank = world;
})();
</script>
</body>
</html>
